name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.8.2
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms1g -Xmx1g'
        ports:
          - 9200:9200
        options: >-
          --health-cmd='curl -s http://localhost:9200/_cluster/health | grep -E "\"status\"' || exit 1'
          --health-interval=10s --health-timeout=5s --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Elasticsearch
        run: |
          echo "Waiting for Elasticsearch to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s | grep -q '"status"'; then
              echo "Elasticsearch is up"
              break
            fi
            echo "Waiting... ($i)"
            sleep 5
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and run Java tests (Maven)
        run: mvn -B test

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: pytest -q

      - name: Run evaluator
        run: python scripts/evaluate_and_test.py
